[project]
name = "driftweight"
version = "0.1.0"
description = "Repulsive drift in MeanFlow space for neural network weight generation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Repository = "https://github.com/Reo-I/DriftWeight-NeurIPS2026"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
